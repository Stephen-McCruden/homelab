# FILE PATH: roles/firewall/defaults/main.yml
# PURPOSE: Default firewalld configuration for Kubernetes nodes.
---

firewall_kubernetes_zone: kubernetes
firewall_external_zone: public

# Keep the firewall Pod CIDR tied to kubeadm's authoritative Pod subnet.
# Pod traffic receives only the explicit host access it needs; it is not
# added as a trusted source to the broader Kubernetes node zone.
firewall_pod_network_cidrs:
  - "{{ kubeadm_config_pod_subnet }}"

firewall_api_server_port: 6443

firewall_control_plane_ports:
  - 80/tcp
  - 443/tcp
  - 6443/tcp
  - 2379-2380/tcp
  - 7946/tcp
  - 7946/udp
  - 9100/tcp
  - 10250/tcp
  - 10257/tcp
  - 10259/tcp

firewall_worker_ports:
  - 80/tcp
  - 443/tcp
  - 7946/tcp
  - 7946/udp
  - 9100/tcp
  - 10250/tcp
  - 10256/tcp

firewall_allow_nodeport_range: false
firewall_nodeport_range: 30000-32767/tcp

