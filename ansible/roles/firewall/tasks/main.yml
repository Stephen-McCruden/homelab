# FILE PATH: roles/firewall/tasks/main.yml
# PURPOSE: Configure source-restricted firewalld access for Kubernetes node
#          traffic and least-privilege Pod access to required host services.
---

- name: Install firewalld through shared package management
  ansible.builtin.include_role:
    name: package_manager
    tasks_from: install
  vars:
    package_manager_packages:
      - firewalld

- name: Enable and start firewalld
  ansible.builtin.systemd_service:
    name: firewalld
    enabled: true
    state: started

- name: Validate firewall variables
  ansible.builtin.assert:
    that:
      - cluster_network_cidr | length > 0
      - management_network_cidrs is iterable
      - tailscale_management_cidrs is iterable
      - firewall_pod_network_cidrs is iterable
      - firewall_pod_network_cidrs | length > 0
      - firewall_kubernetes_zone | length > 0
      - firewall_external_zone | length > 0
      - firewall_api_server_port | int > 0
      - firewall_api_server_port | int <= 65535
      - firewall_kubelet_port | int > 0
      - firewall_kubelet_port | int <= 65535
    fail_msg: >-
      One or more required firewall variables are missing or invalid.

- name: Read permanent firewalld zones
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - --get-zones
  register: firewall_available_zones
  changed_when: false

- name: Verify external firewalld zone exists
  ansible.builtin.assert:
    that:
      - firewall_external_zone in firewall_available_zones.stdout.split()
    fail_msg: >-
      External firewalld zone {{ firewall_external_zone }} does not exist.

- name: Create source-restricted Kubernetes zone
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - "--new-zone={{ firewall_kubernetes_zone }}"
  register: firewall_zone_creation
  changed_when: true
  when:
    - >-
      firewall_kubernetes_zone
      not in firewall_available_zones.stdout.split()

- name: Reload firewalld after zone creation
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --reload
  changed_when: true
  when: firewall_zone_creation.changed | default(false)

- name: Build allowed Kubernetes node source list
  ansible.builtin.set_fact:
    firewall_allowed_sources: >-
      {{
        (
          management_network_cidrs
          + tailscale_management_cidrs
          + [cluster_network_cidr]
        )
        | reject('equalto', '')
        | unique
        | list
      }}

- name: Validate allowed Kubernetes node source list
  ansible.builtin.assert:
    that:
      - firewall_allowed_sources | length > 0
    fail_msg: >-
      No source networks were generated for the Kubernetes firewalld zone.

- name: Read configured Kubernetes zone sources
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - "--zone={{ firewall_kubernetes_zone }}"
      - --list-sources
  register: firewall_configured_sources
  changed_when: false

- name: Build stale Kubernetes zone source list
  ansible.builtin.set_fact:
    firewall_stale_sources: >-
      {{
        firewall_configured_sources.stdout.split()
        | difference(firewall_allowed_sources)
        | list
      }}

- name: Remove stale Kubernetes zone sources
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - "--zone={{ firewall_kubernetes_zone }}"
      - "--remove-source={{ item }}"
  loop: "{{ firewall_stale_sources }}"
  register: firewall_sources_removed
  changed_when: true

- name: Query configured Kubernetes zone sources
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - "--zone={{ firewall_kubernetes_zone }}"
      - "--query-source={{ item }}"
  loop: "{{ firewall_allowed_sources }}"
  register: firewall_source_queries
  changed_when: false
  failed_when: firewall_source_queries.rc not in [0, 1]

- name: Add missing Kubernetes zone sources
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - "--zone={{ firewall_kubernetes_zone }}"
      - "--add-source={{ item.item }}"
  loop: "{{ firewall_source_queries.results }}"
  when: item.rc == 1
  register: firewall_sources_added
  changed_when: true

- name: Query SSH service in Kubernetes zone
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - "--zone={{ firewall_kubernetes_zone }}"
      - --query-service=ssh
  register: firewall_ssh_query
  changed_when: false
  failed_when: firewall_ssh_query.rc not in [0, 1]

- name: Permit SSH in Kubernetes zone
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - "--zone={{ firewall_kubernetes_zone }}"
      - --add-service=ssh
  when: firewall_ssh_query.rc == 1
  register: firewall_ssh_added
  changed_when: true

- name: Build required Kubernetes port list for this host
  ansible.builtin.set_fact:
    firewall_required_ports: >-
      {{
        (
          firewall_control_plane_ports
          if inventory_hostname in groups.get('control_plane', [])
          else firewall_worker_ports
        )
        +
        (
          [firewall_nodeport_range]
          if firewall_allow_nodeport_range | bool
          else []
        )
      }}

- name: Build Pod-to-host access port list for this host
  ansible.builtin.set_fact:
    firewall_pod_host_access_ports: >-
      {{
        (
          [firewall_kubelet_port]
          +
          (
            [firewall_api_server_port]
            if inventory_hostname in groups.get('control_plane', [])
            else []
          )
        )
        | map('string')
        | unique
        | list
      }}

- name: Query required Kubernetes ports
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - "--zone={{ firewall_kubernetes_zone }}"
      - "--query-port={{ item }}"
  loop: "{{ firewall_required_ports }}"
  register: firewall_port_queries
  changed_when: false
  failed_when: firewall_port_queries.rc not in [0, 1]

- name: Add missing Kubernetes ports
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - "--zone={{ firewall_kubernetes_zone }}"
      - "--add-port={{ item.item }}"
  loop: "{{ firewall_port_queries.results }}"
  when: item.rc == 1
  register: firewall_ports_added
  changed_when: true

- name: Query required Pod-to-host rich rules
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - "--zone={{ firewall_external_zone }}"
      - >-
        --query-rich-rule=rule family="ipv4"
        source address="{{ item.0 }}"
        port port="{{ item.1 }}"
        protocol="tcp" accept
  loop: >-
    {{
      firewall_pod_network_cidrs
      | product(firewall_pod_host_access_ports)
      | list
    }}
  register: firewall_pod_host_rule_queries
  changed_when: false
  failed_when: firewall_pod_host_rule_queries.rc not in [0, 1]

- name: Permit Pods to reach required Kubernetes host services
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --permanent
      - "--zone={{ firewall_external_zone }}"
      - >-
        --add-rich-rule=rule family="ipv4"
        source address="{{ item.item.0 }}"
        port port="{{ item.item.1 }}"
        protocol="tcp" accept
  loop: "{{ firewall_pod_host_rule_queries.results | default([]) }}"
  when: item.rc == 1
  register: firewall_pod_host_rules_added
  changed_when: true

- name: Reload firewalld when permanent configuration changed
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - --reload
  when: >-
    firewall_sources_removed.changed | default(false)
    or firewall_sources_added.changed | default(false)
    or firewall_ssh_added.changed | default(false)
    or firewall_ports_added.changed | default(false)
    or firewall_pod_host_rules_added.changed | default(false)
  changed_when: true

- name: Read active Kubernetes zone sources
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - "--zone={{ firewall_kubernetes_zone }}"
      - --list-sources
  register: firewall_active_sources
  changed_when: false

- name: Verify every required Kubernetes source is active
  ansible.builtin.assert:
    that:
      - item in firewall_active_sources.stdout.split()
    fail_msg: >-
      Required source {{ item }} is not active in firewalld zone
      {{ firewall_kubernetes_zone }}.
  loop: "{{ firewall_allowed_sources }}"

- name: Query active required Kubernetes ports
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - "--zone={{ firewall_kubernetes_zone }}"
      - "--query-port={{ item }}"
  loop: "{{ firewall_required_ports }}"
  register: firewall_active_port_queries
  changed_when: false
  failed_when: firewall_active_port_queries.rc not in [0, 1]

- name: Verify every required Kubernetes port is active
  ansible.builtin.assert:
    that:
      - item.rc == 0
    fail_msg: >-
      Required port {{ item.item }} is not active in firewalld zone
      {{ firewall_kubernetes_zone }}.
  loop: "{{ firewall_active_port_queries.results }}"

- name: Query active Pod-to-host rich rules
  ansible.builtin.command:
    argv:
      - firewall-cmd
      - "--zone={{ firewall_external_zone }}"
      - >-
        --query-rich-rule=rule family="ipv4"
        source address="{{ item.0 }}"
        port port="{{ item.1 }}"
        protocol="tcp" accept
  loop: >-
    {{
      firewall_pod_network_cidrs
      | product(firewall_pod_host_access_ports)
      | list
    }}
  register: firewall_active_pod_host_rule_queries
  changed_when: false
  failed_when: firewall_active_pod_host_rule_queries.rc not in [0, 1]

- name: Verify required Pod-to-host rich rules are active
  ansible.builtin.assert:
    that:
      - item.rc == 0
    fail_msg: >-
      Pod CIDR {{ item.item.0 }} cannot reach TCP
      {{ item.item.1 }} through firewalld zone
      {{ firewall_external_zone }}.
  loop: >-
    {{ firewall_active_pod_host_rule_queries.results | default([]) }}
