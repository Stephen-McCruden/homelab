# FILE PATH:
# kubernetes/infrastructure/configs/cert-manager/clusterissuer-production.yaml
# PURPOSE: Configure Let's Encrypt production with a persistent ACME account key
#          supplied by External Secrets Operator.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    email: stephen@mccruden.com
    server: https://acme-v02.api.letsencrypt.org/directory

    # The account key is restored from Azure Key Vault before cert-manager
    # registers or reuses the production ACME account.
    disableAccountKeyGeneration: true
    privateKeySecretRef:
      name: letsencrypt-production-account-key-managed
      key: tls.key

    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token

