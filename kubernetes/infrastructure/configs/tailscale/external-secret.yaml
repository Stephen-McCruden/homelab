# FILE PATH:
# kubernetes/infrastructure/configs/tailscale/external-secret.yaml
# PURPOSE: Restore the Tailscale Operator OAuth client from Azure Key Vault.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
  labels:
    app.kubernetes.io/name: tailscale-operator
    app.kubernetes.io/part-of: homelab-platform
spec:
  refreshInterval: 1h

  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-key-vault

  target:
    name: operator-oauth
    creationPolicy: Owner
    deletionPolicy: Retain

    template:
      type: Opaque

  data:
    - secretKey: client_id
      remoteRef:
        key: tailscale-operator-client-id

    - secretKey: client_secret
      remoteRef:
        key: tailscale-operator-client-secret
