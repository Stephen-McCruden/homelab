# FILE PATH:
# kubernetes/infrastructure/configs/tailscale/namespace.yaml
# PURPOSE: Provide the namespace used by the Tailscale Operator and its
#          privileged ingress proxy pods.
---
apiVersion: v1
kind: Namespace
metadata:
  name: tailscale
  labels:
    app.kubernetes.io/name: tailscale
    app.kubernetes.io/part-of: homelab-platform
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
