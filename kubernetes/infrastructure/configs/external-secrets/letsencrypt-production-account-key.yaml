# FILE PATH:
# kubernetes/infrastructure/configs/external-secrets/letsencrypt-production-account-key.yaml
# PURPOSE: Restore the persistent Let's Encrypt production ACME account key
#          from Azure Key Vault into cert-manager.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: letsencrypt-production-account-key
  namespace: cert-manager
spec:
  refreshInterval: 1h

  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-key-vault

  target:
    # Use a different name from cert-manager's previously generated Secret so
    # External Secrets Operator has unambiguous ownership during migration.
    name: letsencrypt-production-account-key-managed
    creationPolicy: Owner
    deletionPolicy: Retain

    template:
      type: Opaque

  data:
    - secretKey: tls.key
      remoteRef:
        key: letsencrypt-production-account-key
