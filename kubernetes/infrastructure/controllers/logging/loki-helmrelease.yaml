# FILE PATH:
# kubernetes/infrastructure/controllers/logging/loki-helmrelease.yaml
# PURPOSE: Run single-binary Loki with bounded retention on Longhorn.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 30m
  timeout: 15m

  dependsOn:
    - name: kube-prometheus-stack
      namespace: monitoring

  chart:
    spec:
      chart: loki
      version: "7.1.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
      interval: 1h

  install:
    remediation:
      retries: 3

  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true

  rollback:
    timeout: 10m
    cleanupOnFail: true

  values:
    fullnameOverride: loki
    deploymentMode: SingleBinary

    loki:
      auth_enabled: false

      analytics:
        reporting_enabled: false

      commonConfig:
        replication_factor: 1

      storage:
        type: filesystem

      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h

      limits_config:
        retention_period: 336h
        ingestion_rate_mb: 4
        ingestion_burst_size_mb: 8
        max_query_parallelism: 8
        reject_old_samples: true
        reject_old_samples_max_age: 168h

      compactor:
        retention_enabled: true
        retention_delete_delay: 2h
        delete_request_store: filesystem

      querier:
        max_concurrent: 2

    singleBinary:
      replicas: 1

      persistence:
        enabled: true
        storageClass: longhorn
        accessModes:
          - ReadWriteOnce
        size: 30Gi
        whenDeleted: Retain
        whenScaled: Retain
        enableStatefulSetAutoDeletePVC: false

      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: 750m
          memory: 1Gi

      extraEnv:
        - name: GOMEMLIMIT
          value: 900MiB

    gateway:
      enabled: true
      replicas: 1
      verboseLogging: false

      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 192Mi

    backend:
      replicas: 0

    read:
      replicas: 0

    write:
      replicas: 0

    chunksCache:
      enabled: false

    resultsCache:
      enabled: false

    lokiCanary:
      enabled: false

    test:
      enabled: false

    monitoring:
      serviceMonitor:
        enabled: true
        interval: 30s
