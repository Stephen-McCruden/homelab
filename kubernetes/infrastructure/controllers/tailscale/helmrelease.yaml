# FILE PATH:
# kubernetes/infrastructure/controllers/tailscale/helmrelease.yaml
# PURPOSE: Deploy the Tailscale Kubernetes Operator using Azure-restored OAuth
#          credentials without exposing the Kubernetes API server.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  interval: 30m
  timeout: 10m

  chart:
    spec:
      chart: tailscale-operator
      version: "1.98.9"
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: flux-system
      interval: 1h

  install:
    crds: CreateReplace
    remediation:
      retries: 3

  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true

  rollback:
    timeout: 5m
    cleanupOnFail: true

  values:
    # Leaving oauth unset makes the chart mount the externally managed
    # tailscale/operator-oauth Secret.
    oauth: {}

    installCRDs: true

    operatorConfig:
      defaultTags:
        - tag:k8s-operator

    hostname: homelab-k8s-operator
    logging: info

    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

    proxyConfig:
      defaultTags: tag:k8s
      firewallMode: auto

    apiServerProxyConfig:
      allowImpersonation: "false"
      mode: "false"
