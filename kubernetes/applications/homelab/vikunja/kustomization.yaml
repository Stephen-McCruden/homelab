# FILE PATH: kubernetes/applications/homelab/vikunja/kustomization.yaml
# PURPOSE: Deploy Vikunja and its private Tailscale route through Flux.
---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - external-secret.yaml
  - postgres-persistentvolumeclaim.yaml
  - persistentvolumeclaim.yaml
  - postgres-service.yaml
  - postgres-statefulset.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
