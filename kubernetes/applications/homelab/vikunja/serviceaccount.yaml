# FILE PATH: kubernetes/applications/homelab/vikunja/serviceaccount.yaml
# PURPOSE: Give Vikunja a dedicated identity without Kubernetes API access.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vikunja
  namespace: vikunja
  labels:
    app.kubernetes.io/name: vikunja
    app.kubernetes.io/part-of: homelab
automountServiceAccountToken: false
