# FILE PATH: kubernetes/applications/homelab/vikunja/external-secret.yaml
# PURPOSE: Restore Vikunja and PostgreSQL credentials from Azure Key Vault.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vikunja-credentials
  namespace: vikunja
  labels:
    app.kubernetes.io/name: vikunja
    app.kubernetes.io/part-of: homelab
spec:
  refreshInterval: 1h

  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-key-vault

  target:
    name: vikunja-credentials
    creationPolicy: Owner
    deletionPolicy: Retain

    template:
      type: Opaque

  data:
    - secretKey: VIKUNJA_DATABASE_PASSWORD
      remoteRef:
        key: vikunja-database-password

    - secretKey: VIKUNJA_SERVICE_SECRET
      remoteRef:
        key: vikunja-service-secret
