# FILE PATH: kubernetes/applications/homelab/vikunja/service.yaml
# PURPOSE: Provide a stable backend for the private Tailscale ingress.
---
apiVersion: v1
kind: Service
metadata:
  name: vikunja
  namespace: vikunja
  labels:
    app.kubernetes.io/name: vikunja
    app.kubernetes.io/part-of: homelab
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vikunja
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
