# FILE PATH: kubernetes/applications/homelab/vikunja/ingress.yaml
# PURPOSE: Expose Vikunja privately to the tailnet with automatic HTTPS.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vikunja
  namespace: vikunja
  labels:
    app.kubernetes.io/name: vikunja
    app.kubernetes.io/part-of: homelab
  annotations:
    tailscale.com/proxy-class: homelab-ingress
    tailscale.com/tags: tag:k8s
spec:
  ingressClassName: tailscale

  tls:
    - hosts:
        - vikunja

  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vikunja
                port:
                  number: 80
