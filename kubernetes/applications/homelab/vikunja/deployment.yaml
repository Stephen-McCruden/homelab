# FILE PATH: kubernetes/applications/homelab/vikunja/deployment.yaml
# PURPOSE: Run Vikunja with PostgreSQL and persistent attachment storage.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vikunja
  namespace: vikunja
  labels:
    app.kubernetes.io/name: vikunja
    app.kubernetes.io/part-of: homelab
spec:
  replicas: 1
  revisionHistoryLimit: 3

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: vikunja

  template:
    metadata:
      labels:
        app.kubernetes.io/name: vikunja
        app.kubernetes.io/part-of: homelab

    spec:
      serviceAccountName: vikunja
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60

      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - k8s-worker-01
                      - k8s-worker-02

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: vikunja
          image: vikunja/vikunja:2.4.0@sha256:b0ebd2242e1282e9d4351bdfa0b077f1cffbcfd09c380411a0eb46cd9651e901
          imagePullPolicy: IfNotPresent

          env:
            - name: TZ
              value: America/New_York

            - name: VIKUNJA_SERVICE_PUBLICURL
              value: https://vikunja.tailda520f.ts.net/

            - name: VIKUNJA_SERVICE_ENABLEREGISTRATION
              value: "true"

            - name: VIKUNJA_DATABASE_TYPE
              value: postgres

            - name: VIKUNJA_DATABASE_HOST
              value: vikunja-postgres

            - name: VIKUNJA_DATABASE_DATABASE
              value: vikunja

            - name: VIKUNJA_DATABASE_USER
              value: vikunja

            - name: VIKUNJA_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vikunja-credentials
                  key: VIKUNJA_DATABASE_PASSWORD

            - name: VIKUNJA_SERVICE_SECRET
              valueFrom:
                secretKeyRef:
                  name: vikunja-credentials
                  key: VIKUNJA_SERVICE_SECRET

            - name: VIKUNJA_FILES_BASEPATH
              value: /app/vikunja/files

          ports:
            - name: http
              containerPort: 3456
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 90

          readinessProbe:
            httpGet:
              path: /api/v1/info
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/v1/info
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi

          volumeMounts:
            - name: files
              mountPath: /app/vikunja/files

            - name: tmp
              mountPath: /tmp

      volumes:
        - name: files
          persistentVolumeClaim:
            claimName: vikunja-files

        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
