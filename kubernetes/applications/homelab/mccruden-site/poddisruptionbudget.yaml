# FILE PATH:
# kubernetes/applications/homelab/mccruden-site/poddisruptionbudget.yaml
# PURPOSE: Keep one site replica available during voluntary disruptions.
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mccruden-site
  namespace: mccruden-site
  labels:
    app.kubernetes.io/name: mccruden-site
    app.kubernetes.io/part-of: mccruden-com
spec:
  minAvailable: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: mccruden-site
