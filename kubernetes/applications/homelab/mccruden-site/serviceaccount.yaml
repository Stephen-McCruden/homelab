# FILE PATH:
# kubernetes/applications/homelab/mccruden-site/serviceaccount.yaml
# PURPOSE: Give the site a dedicated identity without Kubernetes API credentials.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mccruden-site
  namespace: mccruden-site
  labels:
    app.kubernetes.io/name: mccruden-site
    app.kubernetes.io/part-of: mccruden-com
automountServiceAccountToken: false
