# FILE PATH:
# kubernetes/applications/homelab/homepage/deployment.yaml
# PURPOSE: Run Homepage as a non-root, resource-bounded cluster dashboard.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
    app.kubernetes.io/part-of: homelab
spec:
  replicas: 1
  revisionHistoryLimit: 3

  strategy:
    type: RollingUpdate

  selector:
    matchLabels:
      app.kubernetes.io/name: homepage

  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage
        app.kubernetes.io/part-of: homelab

    spec:
      serviceAccountName: homepage
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v1.13.2
          imagePullPolicy: IfNotPresent

          env:
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP

            - name: HOMEPAGE_VAR_TAILNET_DOMAIN
              value: tailda520f.ts.net

            - name: HOMEPAGE_ALLOWED_HOSTS
              value: >-
                $(MY_POD_IP):3000,homepage.$(HOMEPAGE_VAR_TAILNET_DOMAIN)

            - name: LOG_TARGETS
              value: stdout

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          startupProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60

          readinessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            periodSeconds: 15
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          volumeMounts:
            - name: config
              mountPath: /app/config/kubernetes.yaml
              subPath: kubernetes.yaml
              readOnly: true

            - name: config
              mountPath: /app/config/settings.yaml
              subPath: settings.yaml
              readOnly: true

            - name: config
              mountPath: /app/config/services.yaml
              subPath: services.yaml
              readOnly: true

            - name: config
              mountPath: /app/config/widgets.yaml
              subPath: widgets.yaml
              readOnly: true

            - name: config
              mountPath: /app/config/bookmarks.yaml
              subPath: bookmarks.yaml
              readOnly: true

            - name: config
              mountPath: /app/config/docker.yaml
              subPath: docker.yaml
              readOnly: true

            - name: config
              mountPath: /app/config/custom.css
              subPath: custom.css
              readOnly: true

            - name: config
              mountPath: /app/config/custom.js
              subPath: custom.js
              readOnly: true

            - name: logs
              mountPath: /app/config/logs

            - name: tmp
              mountPath: /tmp

      volumes:
        - name: config
          configMap:
            name: homepage

        - name: logs
          emptyDir:
            sizeLimit: 64Mi

        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
