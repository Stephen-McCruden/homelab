# FILE PATH:
# kubernetes/applications/homelab/homepage/serviceaccount.yaml
# PURPOSE: Give Homepage the identity used for read-only cluster visibility.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
    app.kubernetes.io/part-of: homelab
automountServiceAccountToken: true
