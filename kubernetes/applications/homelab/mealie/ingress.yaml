# FILE PATH:
# kubernetes/applications/homelab/mealie/ingress.yaml
# PURPOSE: Expose Mealie privately to the tailnet with automatic HTTPS.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mealie
  namespace: mealie
  labels:
    app.kubernetes.io/name: mealie
    app.kubernetes.io/part-of: homelab
  annotations:
    tailscale.com/proxy-class: homelab-ingress
    tailscale.com/tags: tag:k8s
spec:
  ingressClassName: tailscale

  tls:
    - hosts:
        - mealie

  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mealie
                port:
                  number: 80
