# FILE PATH:
# kubernetes/applications/homelab/mealie/serviceaccount.yaml
# PURPOSE: Give Mealie a dedicated identity without Kubernetes API credentials.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mealie
  namespace: mealie
  labels:
    app.kubernetes.io/name: mealie
    app.kubernetes.io/part-of: homelab
automountServiceAccountToken: false
