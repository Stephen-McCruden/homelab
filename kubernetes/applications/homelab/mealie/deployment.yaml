# FILE PATH:
# kubernetes/applications/homelab/mealie/deployment.yaml
# PURPOSE: Run Mealie with persistent SQLite storage for household recipes.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mealie
  namespace: mealie
  labels:
    app.kubernetes.io/name: mealie
    app.kubernetes.io/part-of: homelab
spec:
  replicas: 1
  revisionHistoryLimit: 3

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: mealie

  template:
    metadata:
      labels:
        app.kubernetes.io/name: mealie
        app.kubernetes.io/part-of: homelab

    spec:
      serviceAccountName: mealie
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60

      securityContext:
        runAsNonRoot: true
        runAsUser: 911
        runAsGroup: 911
        fsGroup: 911
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: mealie
          image: ghcr.io/mealie-recipes/mealie:v3.22.0@sha256:36c28f0642fb6c75fae8997a2d55994631b9b4bcffba3016c208fc132a4c1e69
          imagePullPolicy: IfNotPresent

          env:
            - name: PUID
              value: "911"

            - name: PGID
              value: "911"

            - name: TZ
              value: America/New_York

            - name: BASE_URL
              value: https://mealie.tailda520f.ts.net

            - name: ALLOW_SIGNUP
              value: "false"

            - name: API_DOCS
              value: "false"

            - name: DB_ENGINE
              value: sqlite

            - name: SQLITE_MIGRATE_JOURNAL_WAL
              value: "true"

          ports:
            - name: http
              containerPort: 9000
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          startupProbe:
            httpGet:
              path: /api/app/about
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 90

          readinessProbe:
            httpGet:
              path: /api/app/about
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/app/about
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi

          volumeMounts:
            - name: data
              mountPath: /app/data

            - name: tmp
              mountPath: /tmp

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mealie-data

        - name: tmp
          emptyDir:
            sizeLimit: 512Mi
