# FILE PATH:
# kubernetes/applications/homelab/mccruden-site-production/serviceaccount.yaml
# PURPOSE: Give the production site an identity without API credentials.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mccruden-site
  namespace: mccruden-site-production
  labels:
    app.kubernetes.io/name: mccruden-site
    app.kubernetes.io/part-of: mccruden-com
    app.kubernetes.io/environment: production
automountServiceAccountToken: false
