# FILE PATH:
# kubernetes/applications/homelab/mccruden-site-production/namespace.yaml
# PURPOSE: Isolate the public production website under restricted pod policy.
---
apiVersion: v1
kind: Namespace
metadata:
  name: mccruden-site-production
  labels:
    app.kubernetes.io/name: mccruden-site
    app.kubernetes.io/part-of: mccruden-com
    app.kubernetes.io/environment: production
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.36
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36
