# FILE PATH:
# kubernetes/applications/homelab/mccruden-site-production/poddisruptionbudget.yaml
# PURPOSE: Keep one production replica available during voluntary disruptions.
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mccruden-site
  namespace: mccruden-site-production
  labels:
    app.kubernetes.io/name: mccruden-site
    app.kubernetes.io/part-of: mccruden-com
    app.kubernetes.io/environment: production
spec:
  minAvailable: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: mccruden-site
