# FILE PATH:
# kubernetes/applications/homelab/linkding/external-secret.yaml
# PURPOSE: Restore Linkding's initial administrator credentials from Azure Key Vault.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: linkding-bootstrap-credentials
  namespace: linkding
  labels:
    app.kubernetes.io/name: linkding
    app.kubernetes.io/part-of: homelab
spec:
  refreshInterval: 1h

  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-key-vault

  target:
    name: linkding-bootstrap-credentials
    creationPolicy: Owner
    deletionPolicy: Retain

    template:
      type: Opaque

  data:
    - secretKey: LD_SUPERUSER_NAME
      remoteRef:
        key: linkding-superuser-name

    - secretKey: LD_SUPERUSER_PASSWORD
      remoteRef:
        key: linkding-superuser-password
