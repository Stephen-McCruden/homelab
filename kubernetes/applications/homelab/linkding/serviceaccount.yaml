# FILE PATH:
# kubernetes/applications/homelab/linkding/serviceaccount.yaml
# PURPOSE: Give Linkding a dedicated identity without Kubernetes API credentials.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: linkding
  namespace: linkding
  labels:
    app.kubernetes.io/name: linkding
    app.kubernetes.io/part-of: homelab
automountServiceAccountToken: false
