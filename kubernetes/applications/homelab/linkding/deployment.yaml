# FILE PATH:
# kubernetes/applications/homelab/linkding/deployment.yaml
# PURPOSE: Run Linkding with persistent SQLite storage and background processing.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkding
  namespace: linkding
  labels:
    app.kubernetes.io/name: linkding
    app.kubernetes.io/part-of: homelab
spec:
  replicas: 1
  revisionHistoryLimit: 3

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: linkding

  template:
    metadata:
      labels:
        app.kubernetes.io/name: linkding
        app.kubernetes.io/part-of: homelab

    spec:
      serviceAccountName: linkding
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30

      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        - name: initialize
          image: sissbruecker/linkding:1.45.0@sha256:61b2eb9eed8e5772a473fb7f1f8923e046cb8cbbeb50e88150afd5ff287d4060
          imagePullPolicy: IfNotPresent

          command:
            - /bin/bash
            - -ceu
          args:
            - |
              mkdir -p \
                /etc/linkding/data/favicons \
                /etc/linkding/data/previews \
                /etc/linkding/data/assets \
                /tmp/home

              python manage.py generate_secret_key
              python manage.py migrate --noinput
              python manage.py enable_wal
              python manage.py create_initial_superuser
              python manage.py migrate_tasks

          envFrom:
            - secretRef:
                name: linkding-bootstrap-credentials

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          volumeMounts:
            - name: data
              mountPath: /etc/linkding/data
            - name: tmp
              mountPath: /tmp

      containers:
        - name: web
          image: sissbruecker/linkding:1.45.0@sha256:61b2eb9eed8e5772a473fb7f1f8923e046cb8cbbeb50e88150afd5ff287d4060
          imagePullPolicy: IfNotPresent

          command:
            - uwsgi
          args:
            - --http
            - 0.0.0.0:9090
            - uwsgi.ini

          env:
            - name: TZ
              value: America/New_York

          ports:
            - name: http
              containerPort: 9090
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60

          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          volumeMounts:
            - name: data
              mountPath: /etc/linkding/data
            - name: tmp
              mountPath: /tmp

        - name: background-worker
          image: sissbruecker/linkding:1.45.0@sha256:61b2eb9eed8e5772a473fb7f1f8923e046cb8cbbeb50e88150afd5ff287d4060
          imagePullPolicy: IfNotPresent

          command:
            - python
          args:
            - manage.py
            - run_huey
            - -f

          env:
            - name: HOME
              value: /tmp/home
            - name: TZ
              value: America/New_York

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          volumeMounts:
            - name: data
              mountPath: /etc/linkding/data
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: linkding-data

        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
