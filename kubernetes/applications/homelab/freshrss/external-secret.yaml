# FILE PATH:
# kubernetes/applications/homelab/freshrss/external-secret.yaml
# PURPOSE: Restore FreshRSS bootstrap credentials from Azure Key Vault.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: freshrss-bootstrap-credentials
  namespace: freshrss
  labels:
    app.kubernetes.io/name: freshrss
    app.kubernetes.io/part-of: homelab
spec:
  refreshInterval: 1h

  secretStoreRef:
    kind: ClusterSecretStore
    name: azure-key-vault

  target:
    name: freshrss-bootstrap-credentials
    creationPolicy: Owner
    deletionPolicy: Retain

    template:
      type: Opaque

  data:
    - secretKey: FRESHRSS_ADMIN_EMAIL
      remoteRef:
        key: freshrss-admin-email

    - secretKey: FRESHRSS_ADMIN_PASSWORD
      remoteRef:
        key: freshrss-admin-password

    - secretKey: FRESHRSS_API_PASSWORD
      remoteRef:
        key: freshrss-api-password
