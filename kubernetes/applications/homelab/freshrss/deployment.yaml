# FILE PATH:
# kubernetes/applications/homelab/freshrss/deployment.yaml
# PURPOSE: Run FreshRSS with automated SQLite bootstrap and feed refreshes.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: freshrss
  namespace: freshrss
  labels:
    app.kubernetes.io/name: freshrss
    app.kubernetes.io/part-of: homelab
spec:
  replicas: 1
  revisionHistoryLimit: 3

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: freshrss

  template:
    metadata:
      labels:
        app.kubernetes.io/name: freshrss
        app.kubernetes.io/part-of: homelab

    spec:
      serviceAccountName: freshrss
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        - name: initialize
          image: freshrss/freshrss:1.29.1-alpine@sha256:e1c956e586ae20ba7f9a0c6582043172ee084af43f17ff48b8de22ade026b6c4
          imagePullPolicy: IfNotPresent

          command:
            - /bin/sh
            - -ceu
          args:
            - |
              ./cli/access-permissions.sh --only-userdirs
              php -f ./cli/prepare.php >/dev/null

              set +e
              php -f ./cli/do-install.php -- \
                --api-enabled \
                --base-url "$FRESHRSS_BASE_URL" \
                --default-user admin \
                --language en
              install_status=$?
              set -e

              if [ "$install_status" -ne 0 ] && [ "$install_status" -ne 3 ]; then
                exit "$install_status"
              fi

              set +e
              php -f ./cli/create-user.php -- \
                --api-password "$FRESHRSS_API_PASSWORD" \
                --email "$FRESHRSS_ADMIN_EMAIL" \
                --language en \
                --password "$FRESHRSS_ADMIN_PASSWORD" \
                --user admin
              user_status=$?
              set -e

              if [ "$user_status" -ne 0 ] && [ "$user_status" -ne 3 ]; then
                exit "$user_status"
              fi

              ./cli/access-permissions.sh --only-userdirs

          env:
            - name: FRESHRSS_BASE_URL
              value: https://freshrss.tailda520f.ts.net

          envFrom:
            - secretRef:
                name: freshrss-bootstrap-credentials

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN

          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          volumeMounts:
            - name: data
              mountPath: /var/www/FreshRSS/data

            - name: tmp
              mountPath: /tmp

      containers:
        - name: freshrss
          image: freshrss/freshrss:1.29.1-alpine@sha256:e1c956e586ae20ba7f9a0c6582043172ee084af43f17ff48b8de22ade026b6c4
          imagePullPolicy: IfNotPresent

          env:
            - name: TZ
              value: America/New_York

            - name: CRON_MIN
              value: 13,43

            - name: FRESHRSS_ENV
              value: production

            - name: LISTEN
              value: 0.0.0.0:8080

            - name: TRUSTED_PROXY
              value: 10.0.0.0/8

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - SETGID
                - SETUID

          startupProbe:
            exec:
              command:
                - php
                - ./cli/health.php
                - --url=http://127.0.0.1:8080/api/
                - --connect_timeout=2
                - --timeout=5
            periodSeconds: 5
            timeoutSeconds: 8
            failureThreshold: 24

          readinessProbe:
            exec:
              command:
                - php
                - ./cli/health.php
                - --url=http://127.0.0.1:8080/api/
                - --connect_timeout=2
                - --timeout=5
            periodSeconds: 10
            timeoutSeconds: 8
            failureThreshold: 3

          livenessProbe:
            exec:
              command:
                - php
                - ./cli/health.php
                - --url=http://127.0.0.1:8080/api/
                - --connect_timeout=2
                - --timeout=5
            periodSeconds: 30
            timeoutSeconds: 8
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          volumeMounts:
            - name: data
              mountPath: /var/www/FreshRSS/data

            - name: tmp
              mountPath: /tmp

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: freshrss-data

        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
