# FILE PATH:
# kubernetes/applications/homelab/freshrss/serviceaccount.yaml
# PURPOSE: Give FreshRSS a dedicated identity without Kubernetes API credentials.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: freshrss
  namespace: freshrss
  labels:
    app.kubernetes.io/name: freshrss
    app.kubernetes.io/part-of: homelab
automountServiceAccountToken: false
