# FILE PATH: clusters/homelab/infrastructure-controllers.yaml
# PURPOSE: Reconcile controllers required by platform configuration and
#          application workloads. Node metrics is reconciled separately.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-controllers
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./kubernetes/infrastructure/controllers/core

  # Keep pruning disabled during the ownership migration. This prevents
  # Metrics Server and the CSR approver from being deleted while their
  # new Kustomizations adopt them.
  prune: false
  wait: true

  sourceRef:
    kind: GitRepository
    name: flux-system
