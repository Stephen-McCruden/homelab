# FILE PATH:
# clusters/homelab/infrastructure-kubelet-csr-approver.yaml
# PURPOSE: Reconcile kubelet serving-certificate approval independently
#          from the application-critical platform controller path.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-kubelet-csr-approver
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./kubernetes/infrastructure/controllers/kubelet-csr-approver
  prune: true
  wait: true

  sourceRef:
    kind: GitRepository
    name: flux-system
