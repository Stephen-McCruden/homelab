# FILE PATH: clusters/homelab/infrastructure-tailscale-operator.yaml
# PURPOSE: Install the Tailscale Kubernetes Operator only after External
#          Secrets has restored its OAuth credentials.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-tailscale-operator
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-configs

  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./kubernetes/infrastructure/controllers/tailscale
  prune: true
  wait: true

  sourceRef:
    kind: GitRepository
    name: flux-system
