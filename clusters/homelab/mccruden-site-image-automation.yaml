# FILE PATH: clusters/homelab/mccruden-site-image-automation.yaml
# PURPOSE: Reconcile only the website image-selection automation resources.
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: mccruden-site-image-automation
  namespace: flux-system
spec:
  dependsOn:
    - name: applications

  interval: 1m
  retryInterval: 1m
  timeout: 5m
  path: ./kubernetes/automation/homelab/mccruden-site
  prune: true
  wait: false

  sourceRef:
    kind: GitRepository
    name: flux-system
